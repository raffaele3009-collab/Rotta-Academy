<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10142A">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rotta">
<title>Rotta Academy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #10142A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #F2EFE9;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .serif { font-family: Georgia, "Iowan Old Style", serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  .eyebrow { color: #8B93BF; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 4px; }
  h1 { font-size: 26px; margin: 0 0 4px; font-weight: 400; }
  .sub { color: #8B93BF; font-size: 14px; margin: 0; }
  .card {
    background: #1A2044;
    border: 1px solid #2A3163;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .score-card { display: flex; align-items: center; gap: 20px; }
  .ring-wrap { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-family: Georgia, serif;
  }
  .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
  .stat-row:last-child { margin-bottom: 0; }
  .icon { width: 15px; height: 15px; flex-shrink: 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1; border-radius: 999px; border: 1px solid #2A3163; padding: 9px 12px;
    background: #1A2044; color: #8B93BF; font-size: 14px; font-weight: 500;
    font-family: inherit; cursor: pointer;
  }
  .tab-btn.active { background: #E7B949; color: #10142A; border-color: #E7B949; }
  .week-row { position: relative; margin-bottom: 10px; }
  .connector { position: absolute; left: 19px; top: 40px; bottom: -10px; width: 2px; background: #2A3163; z-index: 0; }
  .connector.done { background: #E7B949; }
  .week-header {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px;
    background: none; border: none; text-align: left; cursor: pointer; font-family: inherit;
  }
  .week-badge {
    width: 36px; height: 36px; border-radius: 999px; border: 2px solid #2A3163; background: #10142A;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #8B93BF; font-size: 12px;
  }
  .week-badge.done { background: #E7B949; border-color: #E7B949; }
  .week-title { font-size: 14px; font-weight: 500; margin: 0; color: #F2EFE9; }
  .week-sub { font-size: 12px; color: #8B93BF; margin: 3px 0 0; }
  .week-sub.late { color: #E2665A; }
  .week-body { border-top: 1px solid #2A3163; padding: 8px 14px 14px; }
  .course-row {
    width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 8px 0;
    background: none; border: none; text-align: left; cursor: pointer; font-family: inherit;
  }
  .checkbox {
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid #8B93BF; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .checkbox.done { background: #E7B949; border-color: #E7B949; }
  .course-name { font-size: 14px; margin: 0; line-height: 1.35; color: #F2EFE9; }
  .course-name.done { color: #8B93BF; text-decoration: line-through; }
  .tag-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .hours { font-size: 11px; color: #8B93BF; font-family: ui-monospace, monospace; }
  .note { font-size: 11px; color: #8B93BF; font-style: italic; margin: 4px 0 0; }
  .cal-intro { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cal-intro p { font-size: 13px; font-weight: 500; margin: 0; }
  .cal-desc { font-size: 12px; color: #8B93BF; line-height: 1.5; margin: 0; }
  .cal-week-label { font-size: 12px; color: #8B93BF; margin: 0 0 8px; font-family: ui-monospace, monospace; }
  .day-grid { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-cell {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid #2A3163; background: #10142A;
    display: flex; align-items: center; justify-content: center; font-size: 10px; color: #8B93BF;
    font-family: ui-monospace, monospace; flex-shrink: 0;
  }
  .day-cell.active { background: #E7B949; color: #10142A; border-color: #E7B949; }
  .day-cell.today { border-width: 2px; border-color: #E7B949; }
  .cal-due { font-size: 12px; color: #8B93BF; margin: 10px 0 0; }
  .footer { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 20px; opacity: 0.6; }
  .footer p { font-size: 12px; color: #8B93BF; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p class="eyebrow">Rotta verso il traguardo</p>
    <h1 class="serif">20 settembre 2026</h1>
    <p class="sub" id="headerSub"></p>
  </div>

  <div style="height:16px"></div>

  <div class="card score-card">
    <div class="ring-wrap">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="42" fill="none" stroke="#2A3163" stroke-width="8"/>
        <circle id="progressRing" cx="48" cy="48" r="42" fill="none" stroke="#E7B949" stroke-width="8"
          stroke-linecap="round" style="transition: stroke-dashoffset 0.4s ease"/>
      </svg>
      <div class="ring-label" id="percentLabel"></div>
    </div>
    <div style="flex:1; min-width:0;">
      <div class="stat-row">
        <svg class="icon" id="paceIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="paceLabel"></span>
      </div>
      <div class="stat-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#E0A458" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
        </svg>
        <span id="streakLabel"></span>
      </div>
      <div class="stat-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8B93BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="hoursLabel" style="color:#8B93BF"></span>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabPercorso" onclick="setTab('percorso')">Percorso</button>
    <button class="tab-btn" id="tabCalendario" onclick="setTab('calendario')">Calendario</button>
  </div>

  <div id="percorsoView"></div>
  <div id="calendarioView" style="display:none"></div>

  <div class="footer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="#8B93BF" stroke="none"><path d="M12 2l2.9 6.6L22 9.3l-5 4.9 1.2 7.1L12 17.8 5.8 21.3 7 14.2 2 9.3l7.1-.7z"/></svg>
    <p id="remainingLabel"></p>
  </div>
</div>

<script>
const SCHEDULE = [
  { id: "affaf", name: "AI Fluency: Framework & Foundations", week: 0, difficulty: "facile", hours: 3, dueDate: "2026-07-30", note: "Già completato" },
  { id: "c101", name: "Claude 101", week: 1, difficulty: "facile", hours: 1, dueDate: "2026-08-05", note: "Già registrato" },
  { id: "aicap", name: "AI Capabilities and Limitations", week: 1, difficulty: "facile", hours: 1, dueDate: "2026-08-05" },
  { id: "cc101", name: "Claude Code 101", week: 1, difficulty: "facile", hours: 1, dueDate: "2026-08-05" },
  { id: "cowork", name: "Introduction to Claude Cowork", week: 2, difficulty: "media", hours: 1.5, dueDate: "2026-08-12", note: "Utile per il tuo workflow Gmail" },
  { id: "plat101", name: "Claude Platform 101", week: 2, difficulty: "media", hours: 2, dueDate: "2026-08-12" },
  { id: "aifb", name: "AI Fluency for Builders", week: 2, difficulty: "media", hours: 1.5, dueDate: "2026-08-12" },
  { id: "aifsb", name: "AI Fluency for Small Businesses", week: 3, difficulty: "media", hours: 1.5, dueDate: "2026-08-19", note: "Pensato per Sognidor" },
  { id: "ccia", name: "Claude Code in Action", week: 3, difficulty: "media", hours: 2, dueDate: "2026-08-19" },
  { id: "ias", name: "Introduction to agent skills", week: 3, difficulty: "media", hours: 1, dueDate: "2026-08-19" },
  { id: "bwca", name: "Building with the Claude API", week: 4, difficulty: "difficile", hours: 8, dueDate: "2026-08-26", note: "Il più corposo: dividilo in più sessioni" },
  { id: "imcp", name: "Introduction to Model Context Protocol", week: 5, difficulty: "difficile", hours: 2.5, dueDate: "2026-09-02" },
  { id: "isub", name: "Introduction to subagents", week: 5, difficulty: "media", hours: 1, dueDate: "2026-09-02" },
  { id: "mcpadv", name: "Model Context Protocol: Advanced Topics", week: 6, difficulty: "difficile", hours: 2, dueDate: "2026-09-09" },
  { id: "aifedu", name: "AI Fluency for educators", week: 6, difficulty: "facile", hours: 1, dueDate: "2026-09-09" },
  { id: "aifnp", name: "AI Fluency for nonprofits", week: 6, difficulty: "facile", hours: 1, dueDate: "2026-09-09" },
  { id: "aifstu", name: "AI Fluency for students", week: 7, difficulty: "facile", hours: 1, dueDate: "2026-09-16" },
  { id: "teach", name: "Teaching AI Fluency", week: 7, difficulty: "facile", hours: 1, dueDate: "2026-09-16" },
  { id: "bedrock", name: "Claude with Amazon Bedrock", week: 7, difficulty: "difficile", hours: 2, dueDate: "2026-09-16" },
  { id: "vertex", name: "Claude with Google Cloud's Vertex AI", week: 8, difficulty: "difficile", hours: 2, dueDate: "2026-09-20" },
];

const WEEK_RANGES = {
  0: ["2026-07-30", "2026-07-30"],
  1: ["2026-07-30", "2026-08-05"],
  2: ["2026-08-06", "2026-08-12"],
  3: ["2026-08-13", "2026-08-19"],
  4: ["2026-08-20", "2026-08-26"],
  5: ["2026-08-27", "2026-09-02"],
  6: ["2026-09-03", "2026-09-09"],
  7: ["2026-09-10", "2026-09-16"],
  8: ["2026-09-17", "2026-09-20"],
};

const DIFF_STYLE = {
  facile: { label: "Facile", color: "#8FBF9F", bg: "rgba(143,191,159,0.12)" },
  media: { label: "Media", color: "#E0A458", bg: "rgba(224,164,88,0.12)" },
  difficile: { label: "Difficile", color: "#E2665A", bg: "rgba(226,102,90,0.12)" },
};

const DEADLINE = new Date("2026-09-20T23:59:59");
const STORAGE_KEY = "academyTrackerState";

let state = { done: { affaf: true }, doneDates: {} };
let expandedWeek = 1;
let currentTab = "percorso";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function fmtDate(d) {
  return d.toLocaleDateString("it-IT", { day: "numeric", month: "short" });
}
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function dateRange(startStr, endStr) {
  const out = [];
  let cur = new Date(startStr + "T00:00:00");
  const end = new Date(endStr + "T00:00:00");
  while (cur <= end) { out.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
  return out;
}
function todayKey() { return new Date().toISOString().slice(0,10); }

function toggle(id) {
  state.done[id] = !state.done[id];
  if (state.done[id]) state.doneDates[id] = todayKey();
  else delete state.doneDates[id];
  saveState();
  render();
}
function toggleWeek(w) {
  expandedWeek = (expandedWeek === w) ? null : w;
  renderPercorso();
}
function setTab(t) {
  currentTab = t;
  document.getElementById('tabPercorso').classList.toggle('active', t === 'percorso');
  document.getElementById('tabCalendario').classList.toggle('active', t === 'calendario');
  document.getElementById('percorsoView').style.display = t === 'percorso' ? 'block' : 'none';
  document.getElementById('calendarioView').style.display = t === 'calendario' ? 'block' : 'none';
}

const ICONS = {
  up: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
  down: '<path d="M23 18l-9.5-9.5-5 5L1 6"/><path d="M17 18h6v-6"/>',
  minus: '<line x1="5" y1="12" x2="19" y2="12"/>'
};

function render() {
  const today = new Date();
  const total = SCHEDULE.length;
  const completedCount = SCHEDULE.filter(c => state.done[c.id]).length;
  const percent = Math.round((completedCount / total) * 100);
  const totalHours = SCHEDULE.reduce((s,c) => s + c.hours, 0);
  const doneHours = SCHEDULE.filter(c => state.done[c.id]).reduce((s,c) => s + c.hours, 0);
  const daysLeft = Math.max(0, daysBetween(today, DEADLINE));

  document.getElementById('headerSub').textContent =
    `${daysLeft} ${daysLeft === 1 ? 'giorno rimasto' : 'giorni rimasti'} · ${completedCount}/${total} corsi`;

  const circumference = 2 * Math.PI * 42;
  const dashOffset = circumference * (1 - percent / 100);
  const ring = document.getElementById('progressRing');
  ring.setAttribute('stroke-dasharray', circumference);
  ring.setAttribute('stroke-dashoffset', dashOffset);
  document.getElementById('percentLabel').textContent = percent + '%';

  const expectedDone = SCHEDULE.filter(c => new Date(c.dueDate + "T23:59:59") <= today).length;
  const paceDiff = completedCount - expectedDone;
  let paceLabel = "In linea", paceColor = "#E0A458", icon = ICONS.minus;
  if (paceDiff >= 1) { paceLabel = `In anticipo di ${paceDiff}`; paceColor = "#8FBF9F"; icon = ICONS.up; }
  else if (paceDiff <= -1) { paceLabel = `In ritardo di ${Math.abs(paceDiff)}`; paceColor = "#E2665A"; icon = ICONS.down; }
  document.getElementById('paceLabel').textContent = paceLabel;
  document.getElementById('paceLabel').style.color = paceColor;
  const paceIcon = document.getElementById('paceIcon');
  paceIcon.innerHTML = icon;
  paceIcon.setAttribute('stroke', paceColor);

  const dateSet = new Set(Object.values(state.doneDates));
  let streak = 0;
  let cursor = new Date(today); cursor.setHours(0,0,0,0);
  while (true) {
    const key = cursor.toISOString().slice(0,10);
    if (dateSet.has(key)) { streak += 1; cursor.setDate(cursor.getDate() - 1); }
    else break;
  }
  document.getElementById('streakLabel').textContent =
    streak > 0 ? `${streak} ${streak === 1 ? 'giorno' : 'giorni'} di fila` : 'Nessuna serie attiva';

  document.getElementById('hoursLabel').textContent = `${doneHours}h / ${totalHours}h stimate`;
  document.getElementById('remainingLabel').textContent = `${total - completedCount} corsi ancora da completare`;

  renderPercorso();
  renderCalendario();
}

function renderPercorso() {
  const today = new Date();
  const weeks = Object.keys(WEEK_RANGES).map(Number).filter(w => w > 0);
  let html = '';
  weeks.forEach((w, idx) => {
    const courses = SCHEDULE.filter(c => c.week === w);
    const wDone = courses.filter(c => state.done[c.id]).length;
    const [rangeStart, rangeEnd] = WEEK_RANGES[w];
    const rangeEndDate = new Date(rangeEnd + "T23:59:59");
    const isPastDue = today > rangeEndDate && wDone < courses.length;
    const isComplete = wDone === courses.length;
    const isExpanded = expandedWeek === w;

    html += `<div class="week-row">`;
    if (idx < weeks.length - 1) {
      html += `<div class="connector ${isComplete ? 'done' : ''}"></div>`;
    }
    html += `<div class="card" style="${isPastDue ? 'border-color:#E2665A' : ''}">`;
    html += `<button class="week-header" onclick="toggleWeek(${w})">`;
    html += `<div class="week-badge ${isComplete ? 'done' : ''}">${isComplete ? '&#10003;' : w}</div>`;
    html += `<div style="flex:1;min-width:0;">`;
    html += `<p class="week-title">Settimana ${w} · ${fmtDate(new Date(rangeStart+"T00:00:00"))}–${fmtDate(rangeEndDate)}</p>`;
    html += `<p class="week-sub ${isPastDue ? 'late' : ''}">${wDone}/${courses.length} completati${isPastDue ? ' · scaduta' : ''}</p>`;
    html += `</div></button>`;

    if (isExpanded) {
      html += `<div class="week-body">`;
      courses.forEach(c => {
        const d = DIFF_STYLE[c.difficulty];
        const isDone = !!state.done[c.id];
        html += `<button class="course-row" onclick="toggle('${c.id}')">`;
        html += `<div class="checkbox ${isDone ? 'done' : ''}">${isDone ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#10142A" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}</div>`;
        html += `<div style="flex:1;min-width:0;">`;
        html += `<p class="course-name ${isDone ? 'done' : ''}">${c.name}</p>`;
        html += `<div class="tag-row">`;
        html += `<span class="tag" style="color:${d.color};background:${d.bg}">${d.label}</span>`;
        html += `<span class="hours">~${c.hours}h</span>`;
        html += `</div>`;
        if (c.note) html += `<p class="note">${c.note}</p>`;
        html += `</div></button>`;
      });
      html += `</div>`;
    }
    html += `</div></div>`;
  });
  document.getElementById('percorsoView').innerHTML = html;
}

function renderCalendario() {
  const today = new Date();
  const todayStr = todayKey();
  const dateSet = new Set(Object.values(state.doneDates));
  const weeks = Object.keys(WEEK_RANGES).map(Number).sort((a,b) => a-b);

  let html = `<div class="card">
    <div class="cal-intro">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B93BF" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <p>Andamento di frequenza</p>
    </div>
    <p class="cal-desc">Ogni quadratino è un giorno. Si accende quando completi almeno un corso in quel giorno.</p>
  </div>`;

  weeks.forEach(w => {
    const [rangeStart, rangeEnd] = WEEK_RANGES[w];
    const days = dateRange(rangeStart, rangeEnd);
    const courses = SCHEDULE.filter(c => c.week === w);
    html += `<div class="card">`;
    html += `<p class="cal-week-label">${w === 0 ? "Prima dell'inizio" : "Settimana " + w}</p>`;
    html += `<div class="day-grid">`;
    days.forEach(d => {
      const key = d.toISOString().slice(0,10);
      const isToday = key === todayStr;
      const hasActivity = dateSet.has(key);
      html += `<div class="day-cell ${hasActivity ? 'active' : ''} ${isToday ? 'today' : ''}">${d.getDate()}</div>`;
    });
    html += `</div>`;
    if (courses.length > 0) {
      const cDone = courses.filter(c => state.done[c.id]).length;
      html += `<p class="cal-due">Scadenza: ${cDone}/${courses.length} corsi</p>`;
    }
    html += `</div>`;
  });
  document.getElementById('calendarioView').innerHTML = html;
}

loadState();
render();
</script>
</body>
</html>
